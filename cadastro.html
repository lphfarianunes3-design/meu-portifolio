<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - RoboMaker</title>
    <style>
      /* Configurações Gerais */
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background-color: #f4f4f9;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background-color: #2c3e50;
        color: #ffffff;
        padding: 20px;
        text-align: center;
      }

      header h1 {
        margin: 0 0 10px 0;
      }

      nav a {
        color: #3498db;
        text-decoration: none;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      /* Estilização do Formulário */
      form {
        background: #ffffff;
        max-width: 450px;
        width: 100%;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
      }

      p {
        margin-bottom: 15px;
      }

      label {
        font-weight: bold;
        color: #2c3e50;
      }

      /* Inputs de Texto, Email, Senha e Select */
      input[type="text"],
      input[type="email"],
      input[type="password"],
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1rem;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus,
      select:focus {
        border-color: #3498db;
        outline: none;
      }

      /* Opções de Radio Button */
      .radio-group {
        margin: 15px 0;
      }

      .radio-label {
        font-weight: normal;
        margin-right: 15px;
        cursor: pointer;
      }

      input[type="radio"] {
        margin-right: 5px;
        cursor: pointer;
      }

      /* Botão de Envio */
      button {
        width: 100%;
        background-color: #3498db;
        color: white;
        border: none;
        padding: 12px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 10px;
      }

      button:hover {
        background-color: #2980b9;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Crie sua Conta</h1>
      <nav>
        <a href="index.html">← Voltar para a Página Inicial</a>
      </nav>
    </header>

    <main>
      <form>
        <p>
          <label for="nome">Nome Completo:</label>
          <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Digite seu nome completo"
            required 
          />
        </p>

        <p>
          <label for="email">E-mail:</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seu@email.com"
            required 
          />
        </p>

        <p>
          <label for="senha">Senha:</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            placeholder="Crie uma senha forte"
            required 
          />
        </p>

        <div class="radio-group">
          <label>Perfil de Aluno:</label>
          <p>
            <input 
              type="radio" 
              id="estudante" 
              name="perfil" 
              required 
            />
            <label for="estudante" class="radio-label">Estudante</label>

            <input 
              type="radio" 
              id="professor" 
              name="perfil" 
              required 
            />
            <label for="professor" class="radio-label">Professor/Hobbista</label>
          </p>
        </div>

        <p>
          <label for="trilha">Trilha de Interesse:</label>
          <select id="trilha" name="trilha">
            <option>Robótica Básica</option>
            <option>Inteligência Artificial</option>
            <option>Programação</option>
          </select>
        </p>

        <p>
          <button type="submit">Cadastrar</button>
        </p>
      </form>
    </main>
  </body>
</html>
